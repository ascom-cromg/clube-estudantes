<style>
:root{--red:#e3062e;--red2:#bb001f;--soft:#fff2f5;--ink:#1d1719;--muted:#786e70;--line:#eadfe1;--bg:#fffdfd;--green:#16794d;--greenbg:#eaf8f1;--warn:#a35a00;--warnbg:#fff5e5;--shadow:0 18px 48px rgba(54,23,30,.09)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(14px);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.mark{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#1e2329,#3a434c);color:#fff;display:grid;place-items:center;font-weight:900;border:3px solid #d1aa63;box-shadow:inset 0 0 0 2px #fff}.brand strong{display:block;font-size:13px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.nav{display:flex;gap:4px}.nav button,.linkbtn{border:0;background:transparent;padding:9px 12px;border-radius:10px;color:#6f6668;font-size:12px;font-weight:700}.nav button.active,.nav button:hover{background:var(--soft);color:var(--red)}.user{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}.page{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:38px 0 90px}.eyebrow{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--soft);color:var(--red);font-weight:850;font-size:10px;text-transform:uppercase;letter-spacing:.04em}.title{font-size:36px;line-height:1.04;letter-spacing:-.05em;margin:12px 0 8px}.subtitle{margin:0;color:var(--muted);line-height:1.6;max-width:700px;font-size:14px}.grid{display:grid;gap:18px}.g2{grid-template-columns:1.6fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.hero{padding:30px;box-shadow:var(--shadow);min-height:330px}.hero h1{font-size:40px;line-height:1.02;letter-spacing:-.055em;margin:13px 0 14px}.hero h1 span{color:var(--red)}.hero p{font-size:13px;line-height:1.65;color:var(--muted);max-width:710px}.btn{border:0;border-radius:999px;padding:12px 17px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:8px;justify-content:center}.primary{background:var(--red);color:#fff;box-shadow:0 10px 24px rgba(227,6,46,.2)}.primary:hover{background:var(--red2)}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.ghost{background:transparent;color:var(--red)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.progressline{height:8px;background:#f2e7e9;border-radius:999px;overflow:hidden}.progressline span{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff667f)}.progressmeta{display:flex;justify-content:space-between;gap:12px;font-size:11px;margin:14px 0 7px}.progressmeta strong{font-size:13px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.pill{padding:6px 9px;border-radius:999px;font-size:10px;font-weight:800;background:#f6f0f1;color:#6e6567}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.good{background:var(--greenbg);color:var(--green)}.section{margin-top:34px}.sectionhead{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:14px}.sectionhead h2{font-size:24px;letter-spacing:-.04em;margin:0}.sectionhead p{font-size:12px;color:var(--muted);margin:5px 0 0}.feature i{width:38px;height:38px;border-radius:50%;background:var(--red);display:grid;place-items:center;color:#fff;font-style:normal;font-weight:900}.feature h3{font-size:14px;margin:16px 0 6px}.feature p{font-size:11px;color:var(--muted);line-height:1.55;margin:0}.summaryrow{display:grid;gap:11px;padding:12px 0;border-top:1px solid var(--line)}.summaryrow:first-of-type{border-top:0}.summaryrow span{color:var(--muted);font-size:10px}.summaryrow strong{font-size:13px}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.loginleft{padding:48px 8vw;display:flex;justify-content:center;flex-direction:column}.loginright{background:radial-gradient(circle at 22% 20%,#ff93a5 0 2%,transparent 29%),linear-gradient(145deg,#fff7f8,#ffdfe6 55%,#f6bdc8);display:grid;place-items:center;padding:50px;overflow:hidden;position:relative}.loginright:after{content:"";width:420px;height:420px;border:48px solid rgba(227,6,46,.07);border-radius:50%;position:absolute;right:-140px;bottom:-160px}.loginbox{max-width:470px}.loginbox h1{font-size:46px;line-height:1.01;letter-spacing:-.055em;margin:14px 0}.loginbox h1 span{color:var(--red)}.loginbox>p{font-size:14px;line-height:1.65;color:var(--muted)}.loginform{margin-top:26px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;font-weight:850}.input,.select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:0;background:#fff}.input:focus,.select:focus{border-color:#e99cab;box-shadow:0 0 0 4px rgba(227,6,46,.07)}.loginform .btn{width:100%;margin-top:10px;padding:14px}.callout{z-index:1;max-width:420px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.callout h2{font-size:30px;letter-spacing:-.04em;margin:12px 0}.callout p{color:var(--muted);font-size:13px;line-height:1.65}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.checks{display:grid;gap:10px}.check{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:13px}.check input{margin-top:2px}.check span{font-size:12px;line-height:1.45}.savebar{position:sticky;bottom:15px;margin-top:20px;padding:12px 14px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center}.savebar span{font-size:11px;color:var(--muted)}.stat .label{font-size:11px;color:var(--muted);font-weight:700}.stat .value{font-size:31px;font-weight:900;letter-spacing:-.05em;margin-top:8px}.adminlayout{display:grid;grid-template-columns:1fr 310px;gap:18px}.toolbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:800}.filter.active{background:var(--soft);border-color:#f2b7c2;color:var(--red)}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:780px}.table th{padding:11px;text-align:left;background:#fcf8f9;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;color:#807577;letter-spacing:.05em}.table td{padding:12px 11px;border-bottom:1px solid #f3ebed;font-size:11px}.studentcell{display:flex;gap:9px;align-items:center}.studentcell .avatar{width:32px;height:32px}.studentcell strong{display:block}.studentcell span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.campaign{position:sticky;top:92px}.campaign .big{font-size:44px;font-weight:900;color:var(--red);letter-spacing:-.06em}.seg{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:11px}.message{font-size:11px;line-height:1.55;padding:13px;border-radius:12px;background:#fff7f8;border:1px solid #f2d4da}.toast{position:fixed;right:22px;bottom:22px;background:#211a1c;color:#fff;border-radius:12px;padding:12px 15px;font-size:11px;box-shadow:var(--shadow);z-index:99}.mobile{display:none}@media(max-width:900px){.g2,.adminlayout{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.login{grid-template-columns:1fr}.loginright{display:none}.nav{display:none}.campaign{position:static}.mobile{display:flex;position:fixed;left:14px;right:14px;bottom:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;padding:7px;justify-content:space-around;box-shadow:var(--shadow);z-index:40}.mobile button{border:0;background:transparent;padding:9px;font-size:10px;font-weight:800;color:#71686a}.page{padding-bottom:110px}}@media(max-width:620px){.g3,.g4,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:0 16px}.brand span{display:none}.page{width:calc(100% - 28px);padding-top:24px}.hero{padding:23px}.hero h1,.title{font-size:31px}.loginleft{padding:30px 22px}.loginbox h1{font-size:36px}.savebar{align-items:stretch;flex-direction:column;gap:10px}.savebar .btn{width:100%}}
</style>

<body><div id="app"></div>
<script>
const seed=[
{id:1,name:'Marina Alves',email:'marina.alves@exemplo.com',phone:'(31) 99912-3456',city:'Belo Horizonte',institution:'PUC Minas',period:'7º período',student:true,lgpd:true},
{id:2,name:'Lucas Ribeiro',email:'lucas.ribeiro@exemplo.com',phone:'',city:'Contagem',institution:'',period:'5º período',student:true,lgpd:true},
{id:3,name:'Ana Clara Martins',email:'ana.martins@exemplo.com',phone:'(34) 98888-1234',city:'Uberlândia',institution:'UFU',period:'',student:true,lgpd:true},
{id:4,name:'Pedro Henrique',email:'pedro.henrique@exemplo.com',phone:'(38) 99901-2211',city:'Montes Claros',institution:'Unimontes',period:'9º período',student:true,lgpd:true},
{id:5,name:'Isabela Ferreira',email:'isabela.ferreira@exemplo.com',phone:'',city:'Juiz de Fora',institution:'UFJF',period:'3º período',student:true,lgpd:false},
{id:6,name:'Rafael Costa',email:'rafael.costa@exemplo.com',phone:'(35) 98712-9981',city:'Pouso Alegre',institution:'',period:'1º período',student:true,lgpd:true}
];
const keys=['name','email','phone','city','institution','period','student','lgpd'];const labels={name:'Nome completo',email:'E-mail',phone:'WhatsApp',city:'Cidade',institution:'Instituição de ensino',period:'Período da graduação',student:'Confirmação de estudante',lgpd:'Aceite LGPD'};
let state={route:location.hash.replace('#/','')||'login',role:localStorage.getItem('club-role')||'student',students:JSON.parse(localStorage.getItem('club-students')||'null')||seed,currentId:Number(localStorage.getItem('club-current-id')||1),filter:'all',search:''};
const app=document.querySelector('#app');
function save(){localStorage.setItem('club-role',state.role);localStorage.setItem('club-students',JSON.stringify(state.students));localStorage.setItem('club-current-id',state.currentId)}
function current(){return state.students.find(x=>x.id===state.currentId)||state.students[0]}
function pct(s){return Math.round(keys.filter(k=>s[k]===true||(typeof s[k]==='string'&&s[k].trim())).length/keys.length*100)}
function missing(s){return keys.filter(k=>!(s[k]===true||(typeof s[k]==='string'&&s[k].trim())))}
function initials(n=''){return n.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'CE'}
function nav(r){location.hash='#/'+r}
function esc(v=''){return String(v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function toast(t,m=''){let e=document.createElement('div');e.className='toast';e.innerHTML='<strong>'+t+'</strong>'+(m?'<br>'+m:'');document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function chrome(active){const u=current();return `<header class="top"><a href="#/inicio" class="brand"><div class="mark">MG</div><div><strong>Clube dos Estudantes</strong><span>Odontologia • Minas Gerais</span></div></a><nav class="nav"><button data-nav="inicio" class="${active==='inicio'?'active':''}">Início</button><button data-nav="perfil" class="${active==='perfil'?'active':''}">Meu Perfil</button>${state.role==='admin'?`<button data-nav="admin" class="${active==='admin'?'active':''}">Painel Administrativo</button>`:''}</nav><div class="user"><button class="linkbtn" data-logout>Sair</button><div class="avatar">${initials(u.name)}</div></div></header><div class="mobile"><button data-nav="inicio">Início</button><button data-nav="perfil">Meu Perfil</button>${state.role==='admin'?'<button data-nav="admin">Admin</button>':''}</div>`}
function login(){return `<main class="login"><section class="loginleft"><div class="loginbox"><a class="brand" href="#/login"><div class="mark">MG</div><div><strong>Clube dos Estudantes</strong><span>Odontologia de Minas Gerais</span></div></a><div style="margin-top:48px"><span class="eyebrow">Área do estudante</span><h1>Seu Clube,<br><span>agora mais perto.</span></h1><p>Acesse seu perfil, acompanhe benefícios e mantenha seus dados atualizados para aproveitar tudo o que o Clube oferece.</p></div><form id="login" class="loginform"><div class="field"><label>E-mail</label><input id="loginEmail" class="input" type="email" value="marina.alves@exemplo.com" required></div><div class="field" style="margin-top:12px"><label>Senha</label><input class="input" type="password" value="12345678" required></div><button class="btn primary" type="submit">Entrar →</button><button class="btn secondary" type="button" data-first>Primeiro acesso / completar cadastro</button><button class="btn ghost" type="button" data-admin>Acesso administrativo</button></form></div></section><aside class="loginright"><div class="callout"><span class="eyebrow">Complete seu cadastro</span><h2>Seu perfil abre as portas para mais oportunidades.</h2><p>Atualize instituição, período, cidade e WhatsApp para receber benefícios, conteúdos e convites alinhados ao seu momento na graduação.</p><div class="pill good">Leva menos de 2 minutos</div></div></aside></main>`}
function home(){const s=current(),p=pct(s),m=missing(s);return `<div>${chrome('inicio')}<main class="page"><div class="grid g2"><section class="card hero"><span class="eyebrow">Sua área no Clube</span><h1>Olá, ${esc(s.name.split(' ')[0])}.<br><span>${p<100?'Complete seu cadastro.':'Seu cadastro está completo!'}</span></h1><p>Quanto mais completo estiver seu perfil, melhor conseguimos conectar você a benefícios, eventos, parceiros e oportunidades alinhadas à sua jornada na Odontologia.</p><div class="progressmeta"><strong>${p}% concluído</strong><span>${m.length?m.length+' campo(s) pendente(s)':'Tudo certo'}</span></div><div class="progressline"><span style="width:${p}%"></span></div>${m.length?`<div class="pills">${m.slice(0,4).map(k=>`<span class="pill warn">${labels[k]}</span>`).join('')}</div>`:''}<div class="actions"><button class="btn primary" data-nav="perfil">${p<100?'Completar meu cadastro':'Ver meu perfil'} →</button><button class="btn secondary" data-benefits>Ver benefícios</button></div></section><aside class="card"><span class="eyebrow">Resumo do perfil</span><h2 style="font-size:20px;margin:13px 0 18px">Seus dados acadêmicos</h2><div class="summaryrow"><span>Instituição</span><strong>${esc(s.institution||'Não informada')}</strong></div><div class="summaryrow"><span>Período</span><strong>${esc(s.period||'Não informado')}</strong></div><div class="summaryrow"><span>Cidade</span><strong>${esc(s.city||'Não informada')}</strong></div><div class="summaryrow"><span>WhatsApp</span><strong>${esc(s.phone||'Não informado')}</strong></div></aside></div><section class="section" id="benefits"><div class="sectionhead"><div><span class="eyebrow">Benefícios</span><h2>O que você encontra no Clube</h2><p>Uma experiência pensada para apoiar sua jornada acadêmica.</p></div></div><div class="grid g3"><div class="card feature"><i>％</i><h3>Descontos exclusivos</h3><p>Vantagens em marcas e lojas parceiras para o dia a dia acadêmico.</p></div><div class="card feature"><i>◎</i><h3>Cursos e capacitações</h3><p>Conteúdos para ir além da grade curricular e acelerar sua formação.</p></div><div class="card feature"><i>★</i><h3>Brindes e sorteios</h3><p>Ações exclusivas, kits e oportunidades para membros do Clube.</p></div><div class="card feature"><i>▣</i><h3>Eventos e experiências</h3><p>Encontros e vivências para aproximar você do mercado.</p></div><div class="card feature"><i>↗</i><h3>Início de carreira</h3><p>Orientações para os primeiros passos profissionais.</p></div><div class="card feature"><i>＋</i><h3>Parceiros exclusivos</h3><p>Uma rede conectada ao universo da Odontologia em Minas Gerais.</p></div></div></section></main></div>`}
function profile(){const s=current(),p=pct(s);return `<div>${chrome('perfil')}<main class="page"><span class="eyebrow">Meu perfil</span><h1 class="title">Complete seu cadastro</h1><p class="subtitle">Mantenha seus dados atualizados para receber comunicações, benefícios e oportunidades mais relevantes.</p><div class="grid g2" style="margin-top:24px"><form id="profile" class="card"><div class="formgrid"><div class="field full"><label>Nome completo</label><input class="input" name="name" value="${esc(s.name)}" required></div><div class="field"><label>E-mail</label><input class="input" type="email" name="email" value="${esc(s.email)}" required></div><div class="field"><label>WhatsApp</label><input class="input" name="phone" value="${esc(s.phone)}" placeholder="(31) 99999-9999"></div><div class="field"><label>Cidade</label><input class="input" name="city" value="${esc(s.city)}"></div><div class="field"><label>Instituição de ensino</label><input class="input" name="institution" value="${esc(s.institution)}"></div><div class="field full"><label>Período da graduação</label><select class="select" name="period"><option value="">Selecione</option>${Array.from({length:12},(_,i)=>`${i+1}º período`).map(v=>`<option ${s.period===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="full checks"><label class="check"><input type="checkbox" name="student" ${s.student?'checked':''}><span><strong>Confirmo que sou estudante de Odontologia.</strong><br>Esta confirmação ajuda a manter a comunidade adequada ao público do Clube.</span></label><label class="check"><input type="checkbox" name="lgpd" ${s.lgpd?'checked':''}><span><strong>Autorizo o uso dos meus dados para as finalidades do Clube.</strong><br>Dados utilizados para relacionamento, benefícios, convites e comunicações institucionais.</span></label></div></div><div class="savebar"><span>Progresso atual: <strong>${p}%</strong></span><button class="btn primary" type="submit">Salvar alterações</button></div></form><aside class="card"><span class="eyebrow">Progresso</span><div style="font-size:52px;font-weight:900;letter-spacing:-.06em;margin:12px 0 4px;color:var(--red)">${p}%</div><p class="subtitle" style="font-size:12px">${p===100?'Cadastro completo. Você já está pronto para aproveitar as próximas ações do Clube.':'Preencha os campos pendentes para concluir seu perfil.'}</p><div class="progressline" style="margin-top:18px"><span style="width:${p}%"></span></div><div class="pills">${missing(s).map(k=>`<span class="pill warn">${labels[k]}</span>`).join('')||'<span class="pill good">Tudo preenchido</span>'}</div></aside></div></main></div>`}
function admin(){const total=state.students.length,complete=state.students.filter(s=>pct(s)===100).length,incomplete=total-complete,rate=total?Math.round(complete/total*100):0;let rows=state.students.filter(s=>{let ok=state.filter==='all'||state.filter==='incomplete'&&pct(s)<100||state.filter==='complete'&&pct(s)===100||state.filter==='noPhone'&&!s.phone||state.filter==='noInstitution'&&!s.institution;let q=state.search.toLowerCase();return ok&&(!q||[s.name,s.email,s.city,s.institution].join(' ').toLowerCase().includes(q))});return `<div>${chrome('admin')}<main class="page"><span class="eyebrow">Gestão</span><h1 class="title">Painel Administrativo</h1><p class="subtitle">Acompanhe a qualidade da base e concentre esforços na campanha “Complete seu cadastro”.</p><div class="grid g4" style="margin-top:24px"><div class="card stat"><div class="label">Estudantes na base</div><div class="value">${total}</div></div><div class="card stat"><div class="label">Cadastros completos</div><div class="value">${complete}</div></div><div class="card stat"><div class="label">Cadastros incompletos</div><div class="value">${incomplete}</div></div><div class="card stat"><div class="label">Taxa de conclusão</div><div class="value">${rate}%</div><div class="progressline"><span style="width:${rate}%"></span></div></div></div><section class="section"><div class="sectionhead"><div><h2>Base de estudantes</h2><p>Visualize pendências e segmente a campanha.</p></div><div class="actions" style="margin:0"><label class="btn secondary" for="import">Importar planilha</label><input id="import" hidden type="file" accept=".xlsx,.xls,.csv"><button class="btn secondary" data-export>Exportar CSV</button></div></div><div class="adminlayout"><section><div class="toolbar"><input class="input" id="search" placeholder="Buscar estudante, cidade ou instituição" value="${esc(state.search)}"></div><div class="filters">${[['all','Todos'],['incomplete','Cadastro incompleto'],['complete','Completo'],['noPhone','Sem WhatsApp'],['noInstitution','Sem instituição']].map(([k,l])=>`<button class="filter ${state.filter===k?'active':''}" data-filter="${k}">${l}</button>`).join('')}</div><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>Estudante</th><th>Cidade</th><th>Instituição</th><th>Período</th><th>Status</th><th>Progresso</th></tr></thead><tbody>${rows.length?rows.map(s=>`<tr><td><div class="studentcell"><div class="avatar">${initials(s.name)}</div><div><strong>${esc(s.name)}</strong><span>${esc(s.email)}</span></div></div></td><td>${esc(s.city||'—')}</td><td>${s.institution?esc(s.institution):'<span class="pill warn">Pendente</span>'}</td><td>${esc(s.period||'—')}</td><td>${pct(s)===100?'<span class="pill good">Completo</span>':'<span class="pill warn">Incompleto</span>'}</td><td><strong>${pct(s)}%</strong></td></tr>`).join(''):'<tr><td colspan="6">Nenhum estudante encontrado.</td></tr>'}</tbody></table></div></section><aside class="card campaign"><span class="eyebrow">Campanha ativa</span><h3>Complete seu cadastro</h3><div class="big">${incomplete}</div><p class="subtitle" style="font-size:11px">estudantes com pelo menos uma informação pendente</p><div style="margin-top:16px"><div class="seg"><span>Sem WhatsApp</span><strong>${state.students.filter(s=>!s.phone).length}</strong></div><div class="seg"><span>Sem instituição</span><strong>${state.students.filter(s=>!s.institution).length}</strong></div><div class="seg"><span>Sem período</span><strong>${state.students.filter(s=>!s.period).length}</strong></div><div class="seg"><span>LGPD pendente</span><strong>${state.students.filter(s=>!s.lgpd).length}</strong></div></div><div class="message"><strong>Mensagem sugerida</strong><br><br>Seu perfil no Clube dos Estudantes ainda está incompleto. Atualize seus dados em poucos minutos para continuar recebendo benefícios, convites e oportunidades de acordo com sua jornada na Odontologia.</div><button class="btn primary" style="width:100%;margin-top:12px" data-campaign>Preparar campanha →</button></aside></div></section></main></div>`}
function normalize(k=''){return String(k).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function pick(r,aliases){for(const a of aliases){let f=Object.entries(r).find(([k])=>normalize(k)===normalize(a));if(f&&f[1]!=null)return String(f[1]).trim()}return''}
function boolish(v){let t=normalize(v);return ['sim','true','1','aceito','concordo','confirmo','confirmado'].some(x=>t===x||t.includes(x))}
function mapRows(rows){return rows.map((r,i)=>({id:i+1,name:pick(r,['Nome completo','Nome']),email:pick(r,['E-mail','Email','E mail']),phone:pick(r,['WhatsApp','Whatsapp','Telefone','Celular']),city:pick(r,['Cidade','Cidade de moradia']),institution:pick(r,['Instituição de ensino','Instituicao de ensino','Instituição','Faculdade','Universidade']),period:pick(r,['Período da graduação','Periodo da graduacao','Período','Periodo','Semestre']),student:boolish(pick(r,['Confirmação de estudante','Confirmacao de estudante','Estudante']))||true,lgpd:boolish(pick(r,['Aceite LGPD','LGPD','Consentimento LGPD']))})).filter(s=>s.name||s.email)}
async function importSheet(file){let rows=[];if(file.name.toLowerCase().endsWith('.csv')){let txt=await file.text(),wb=XLSX.read(txt,{type:'string'}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''})}else{let data=await file.arrayBuffer(),wb=XLSX.read(data,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''})}let parsed=mapRows(rows);if(!parsed.length)return toast('Não foi possível mapear a planilha');state.students=parsed;state.currentId=parsed[0].id;save();toast('Planilha importada',parsed.length+' registros carregados.');render()}
function exportCSV(){let h=['Nome completo','E-mail','WhatsApp','Cidade','Instituição de ensino','Período da graduação','Estudante confirmado','Aceite LGPD','Status','Progresso'],rows=state.students.map(s=>[s.name,s.email,s.phone,s.city,s.institution,s.period,s.student?'Sim':'Não',s.lgpd?'Sim':'Não',pct(s)===100?'Completo':'Incompleto',pct(s)+'%']),csv=[h,...rows].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clube-estudantes-cadastro.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function wire(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));document.querySelector('[data-logout]')?.addEventListener('click',()=>{localStorage.removeItem('club-role');state.role='student';nav('login')});document.querySelector('[data-benefits]')?.addEventListener('click',()=>document.querySelector('#benefits')?.scrollIntoView({behavior:'smooth'}));document.querySelector('#login')?.addEventListener('submit',e=>{e.preventDefault();let email=document.querySelector('#loginEmail').value.trim().toLowerCase(),f=state.students.find(s=>s.email.toLowerCase()===email);state.currentId=f?.id||1;state.role='student';save();nav('inicio')});document.querySelector('[data-first]')?.addEventListener('click',()=>{state.role='student';save();nav('perfil')});document.querySelector('[data-admin]')?.addEventListener('click',()=>{state.role='admin';save();nav('admin')});document.querySelector('#profile')?.addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target),s=current();['name','email','phone','city','institution','period'].forEach(k=>s[k]=(fd.get(k)||'').trim());s.student=fd.get('student')==='on';s.lgpd=fd.get('lgpd')==='on';save();toast('Cadastro atualizado','Seu progresso foi recalculado.');render()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelector('#search')?.addEventListener('input',e=>{state.search=e.target.value;clearTimeout(window.__t);window.__t=setTimeout(render,180)});document.querySelector('#import')?.addEventListener('change',e=>{let f=e.target.files?.[0];if(f)importSheet(f)});document.querySelector('[data-export]')?.addEventListener('click',exportCSV);document.querySelector('[data-campaign]')?.addEventListener('click',()=>toast('Segmento preparado',state.students.filter(s=>pct(s)<100).length+' estudantes selecionados.'))}
function render(){state.route=location.hash.replace('#/','')||'login';if(state.route==='login')app.innerHTML=login();else if(state.route==='inicio')app.innerHTML=home();else if(state.route==='perfil')app.innerHTML=profile();else if(state.route==='admin'){state.role='admin';app.innerHTML=admin()}else app.innerHTML=home();wire()}
window.addEventListener('hashchange',render);render();
</script></body></html>
