<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e3062e">
<title>Clube dos Estudantes de Odontologia de Minas Gerais</title>
<style>
:root{--red:#e3062e;--red2:#b90020;--pink:#fff1f4;--ink:#1e181a;--muted:#776d70;--line:#eadfe2;--bg:#fffdfd;--green:#14764b;--greenbg:#eaf8f1;--warn:#9b5800;--warnbg:#fff4e3;--shadow:0 18px 52px rgba(58,22,31,.10)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid var(--line);background:rgba(255,255,255,.93);backdrop-filter:blur(12px);position:sticky;top:0;z-index:30}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.mark{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#202329,#39424b);color:#fff;display:grid;place-items:center;font-weight:900;border:3px solid #d5ae66;box-shadow:inset 0 0 0 2px #fff}.brand strong{display:block;font-size:13px}.brand span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.nav{display:flex;gap:4px}.nav button,.linkbtn{border:0;background:transparent;padding:9px 12px;border-radius:10px;color:#6e6567;font-size:12px;font-weight:750}.nav button.active,.nav button:hover{background:var(--pink);color:var(--red)}.user{display:flex;align-items:center;gap:9px}.avatar{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:850;font-size:12px}.page{width:min(1160px,calc(100% - 32px));margin:0 auto;padding:38px 0 90px}.eyebrow{display:inline-flex;padding:6px 9px;border-radius:999px;background:var(--pink);color:var(--red);font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}.title{font-size:36px;line-height:1.05;letter-spacing:-.05em;margin:12px 0 8px}.subtitle{margin:0;color:var(--muted);font-size:14px;line-height:1.6;max-width:720px}.grid{display:grid;gap:18px}.g2{grid-template-columns:1.55fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px}.hero{padding:30px;box-shadow:var(--shadow)}.hero h1{font-size:40px;line-height:1.03;letter-spacing:-.055em;margin:13px 0 14px}.hero h1 span{color:var(--red)}.hero p{font-size:13px;line-height:1.65;color:var(--muted);max-width:700px}.btn{border:0;border-radius:999px;padding:12px 17px;font-weight:850;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:disabled{opacity:.55;cursor:not-allowed}.primary{background:var(--red);color:#fff;box-shadow:0 10px 24px rgba(227,6,46,.20)}.primary:hover:not(:disabled){background:var(--red2)}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.ghost{background:transparent;color:var(--red)}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:11px;font-weight:850}.input,.select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:0;background:#fff;color:var(--ink)}.input:focus,.select:focus{border-color:#e7a0af;box-shadow:0 0 0 4px rgba(227,6,46,.07)}.input[readonly]{background:#faf7f8;color:#675e60}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.progressline{height:8px;background:#f2e7e9;border-radius:999px;overflow:hidden}.progressline span{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff657e)}.progressmeta{display:flex;justify-content:space-between;gap:12px;font-size:11px;margin:14px 0 7px}.progressmeta strong{font-size:13px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:10px;font-weight:850;background:#f5eff1;color:#6b6264}.pill.good{background:var(--greenbg);color:var(--green)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.summaryrow{display:grid;gap:5px;padding:12px 0;border-top:1px solid var(--line)}.summaryrow:first-of-type{border-top:0}.summaryrow span{font-size:10px;color:var(--muted)}.summaryrow strong{font-size:13px}.section{margin-top:34px}.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}.sectionhead h2{font-size:24px;letter-spacing:-.04em;margin:0}.sectionhead p{font-size:12px;color:var(--muted);margin:5px 0 0}.feature i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-style:normal;font-weight:900}.feature h3{font-size:14px;margin:16px 0 6px}.feature p{font-size:11px;line-height:1.55;color:var(--muted);margin:0}.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#fff}.loginleft{padding:48px 8vw;display:flex;justify-content:center;flex-direction:column}.loginright{background:radial-gradient(circle at 20% 18%,#ff9bad 0 2%,transparent 29%),linear-gradient(145deg,#fff8f9,#ffe0e6 55%,#f6bec8);display:grid;place-items:center;padding:50px;overflow:hidden;position:relative}.loginright:after{content:"";width:430px;height:430px;border:48px solid rgba(227,6,46,.07);border-radius:50%;position:absolute;right:-145px;bottom:-165px}.loginbox{max-width:470px}.loginbox h1{font-size:46px;line-height:1.01;letter-spacing:-.055em;margin:14px 0}.loginbox h1 span{color:var(--red)}.loginbox>p{font-size:14px;line-height:1.65;color:var(--muted)}.loginform{margin-top:26px}.loginform .btn{width:100%;margin-top:10px;padding:14px}.callout{z-index:1;max-width:420px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.92);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.callout h2{font-size:30px;letter-spacing:-.04em;margin:12px 0}.callout p{color:var(--muted);font-size:13px;line-height:1.65}.notice{padding:13px 14px;border-radius:13px;font-size:11px;line-height:1.55;margin-top:14px}.notice.info{background:#f7f3f4;border:1px solid var(--line);color:#62595c}.notice.warn{background:var(--warnbg);border:1px solid #f3d7ab;color:#754400}.notice.good{background:var(--greenbg);border:1px solid #cdebdc;color:#195f42}.filebox{border:1px dashed #d8c5c9;border-radius:15px;padding:18px;background:#fffafb}.filebox input{width:100%;font-size:11px}.filebox p{font-size:10px;color:var(--muted);line-height:1.45;margin:9px 0 0}.savebar{position:sticky;bottom:15px;margin-top:20px;padding:12px 14px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center}.savebar span{font-size:11px;color:var(--muted)}.stat .label{font-size:11px;color:var(--muted);font-weight:750}.stat .value{font-size:31px;font-weight:900;letter-spacing:-.05em;margin-top:8px}.toolbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:10px;font-weight:850}.filter.active{background:var(--pink);color:var(--red);border-color:#efb7c2}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px}.table{width:100%;border-collapse:collapse;min-width:780px}.table th{padding:11px;text-align:left;background:#fcf8f9;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;color:#807577;letter-spacing:.05em}.table td{padding:12px 11px;border-bottom:1px solid #f3ebed;font-size:11px}.studentcell{display:flex;gap:9px;align-items:center}.studentcell .avatar{width:32px;height:32px}.studentcell strong{display:block}.studentcell span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}.spinner.dark{border-color:#ddd;border-top-color:var(--red)}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;right:22px;bottom:22px;background:#211a1c;color:#fff;border-radius:12px;padding:12px 15px;font-size:11px;box-shadow:var(--shadow);z-index:99;max-width:360px}.mobile{display:none}@media(max-width:900px){.g2{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(2,1fr)}.login{grid-template-columns:1fr}.loginright{display:none}.nav{display:none}.mobile{display:flex;position:fixed;left:14px;right:14px;bottom:12px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:18px;padding:7px;justify-content:space-around;box-shadow:var(--shadow);z-index:40}.mobile button{border:0;background:transparent;padding:9px;font-size:10px;font-weight:850;color:#71686a}.page{padding-bottom:110px}}@media(max-width:620px){.g3,.g4,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.top{padding:0 16px}.brand span{display:none}.page{width:calc(100% - 28px);padding-top:24px}.hero{padding:23px}.hero h1,.title{font-size:31px}.loginleft{padding:30px 22px}.loginbox h1{font-size:36px}.savebar{align-items:stretch;flex-direction:column;gap:10px}.savebar .btn{width:100%}}
</style>
<script src="config.js"></script>
</head>
<body><div id="app"></div>
<script>
const API_URL=(window.CLUBE_API_URL||'').trim();
const app=document.querySelector('#app');
let state={route:location.hash.replace('#/','')||'login',email:sessionStorage.getItem('club-email')||'',token:sessionStorage.getItem('club-token')||'',profile:null,adminToken:sessionStorage.getItem('club-admin-token')||'',admin:null,filter:'all',search:''};

function esc(v=''){return String(v).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function initials(n=''){return n.trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'CE'}
function nav(r){location.hash='#/'+r}
function toast(t,m=''){const e=document.createElement('div');e.className='toast';e.innerHTML='<strong>'+esc(t)+'</strong>'+(m?'<br>'+esc(m):'');document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
function setLoading(btn,on,label){if(!btn)return;if(on){btn.dataset.old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spinner"></span>'+esc(label||'Aguarde')}else{btn.disabled=false;btn.innerHTML=btn.dataset.old||label||'Continuar'}}
function logout(){state.token='';state.profile=null;state.email='';sessionStorage.removeItem('club-token');sessionStorage.removeItem('club-email');nav('login')}
function adminLogout(){state.adminToken='';state.admin=null;sessionStorage.removeItem('club-admin-token');nav('login')}
function isConfigured(){return /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(API_URL)}
async function api(payload){if(!isConfigured())throw new Error('A integração com a planilha ainda não foi ativada.');const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});if(!r.ok)throw new Error('Falha de comunicação com o banco de dados.');let data;try{data=await r.json()}catch(_){throw new Error('Resposta inválida do servidor.')}if(!data.ok)throw new Error(data.error||'Não foi possível concluir a solicitação.');return data}

function chrome(active){const p=state.profile||{};return `<header class="top"><a class="brand" href="#/inicio"><div class="mark">MG</div><div><strong>Clube dos Estudantes</strong><span>Odontologia • Minas Gerais</span></div></a><nav class="nav"><button data-nav="inicio" class="${active==='inicio'?'active':''}">Início</button><button data-nav="perfil" class="${active==='perfil'?'active':''}">Meu Perfil</button></nav><div class="user"><button class="linkbtn" data-logout>Sair</button><div class="avatar">${initials(p.name)}</div></div></header><div class="mobile"><button data-nav="inicio">Início</button><button data-nav="perfil">Meu Perfil</button></div>`}

function loginView(){return `<main class="login"><section class="loginleft"><div class="loginbox"><a class="brand" href="#/login"><div class="mark">MG</div><div><strong>Clube dos Estudantes</strong><span>Odontologia de Minas Gerais</span></div></a><div style="margin-top:48px"><span class="eyebrow">Complete seu cadastro</span><h1>Encontre seu cadastro<br><span>pelo seu e-mail.</span></h1><p>Use o mesmo e-mail informado na inscrição do Clube. Para proteger seus dados, enviaremos um código de acesso para esse endereço antes de exibir seu perfil.</p></div><form id="emailForm" class="loginform"><div class="field"><label>E-mail cadastrado</label><input id="emailInput" class="input" type="email" autocomplete="email" placeholder="voce@exemplo.com" value="${esc(state.email)}" required></div><button id="emailBtn" class="btn primary" type="submit">Continuar →</button></form>${!isConfigured()?'<div class="notice warn"><strong>Integração em ativação.</strong><br>O portal já está preparado para a base oficial, mas o backend do Google ainda precisa ser publicado uma única vez.</div>':''}<button class="btn ghost" style="margin-top:14px;padding-left:0" data-admin-open>Área administrativa</button></div></section><aside class="loginright"><div class="callout"><span class="eyebrow">Cadastro completo</span><h2>Endereço e matrícula atualizada em um único fluxo.</h2><p>Após validar seu e-mail, você poderá conferir os dados já cadastrados, informar seu endereço completo e anexar o comprovante de matrícula atualizado.</p><div class="pills"><span class="pill good">Código por e-mail</span><span class="pill good">Arquivo protegido no Drive</span></div></div></aside></main>`}

function codeView(){return `<main class="login"><section class="loginleft"><div class="loginbox"><a class="brand" href="#/login"><div class="mark">MG</div><div><strong>Clube dos Estudantes</strong><span>Odontologia de Minas Gerais</span></div></a><div style="margin-top:48px"><span class="eyebrow">Verificação</span><h1>Confira seu<br><span>e-mail.</span></h1><p>Se <strong>${esc(state.email)}</strong> estiver cadastrado no Clube, enviamos um código de 6 dígitos. Ele é válido por 10 minutos.</p></div><form id="codeForm" class="loginform"><div class="field"><label>Código de acesso</label><input id="codeInput" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" required></div><button id="codeBtn" class="btn primary" type="submit">Confirmar código →</button><button class="btn secondary" type="button" data-resend>Reenviar código</button><button class="btn ghost" type="button" data-back-email>Usar outro e-mail</button></form><div class="notice info">Não recebeu? Verifique a caixa de spam e confirme se digitou exatamente o e-mail usado na inscrição.</div></div></section><aside class="loginright"><div class="callout"><span class="eyebrow">Segurança dos dados</span><h2>Seu e-mail identifica o cadastro. O código confirma que ele é seu.</h2><p>Assim, a base completa de estudantes nunca é enviada para o navegador e cada pessoa acessa somente o próprio registro.</p></div></aside></main>`}

function homeView(){const p=state.profile;return `<div>${chrome('inicio')}<main class="page"><div class="grid g2"><section class="card hero"><span class="eyebrow">Sua área no Clube</span><h1>Olá, ${esc((p.name||'').split(' ')[0])}.<br><span>${p.complete?'Seu cadastro está completo!':'Falta pouco para completar.'}</span></h1><p>${p.complete?'Seus dados de endereço e o comprovante de matrícula já constam na base do Clube. Você pode atualizar essas informações quando necessário.':'Para finalizar seu cadastro, informe seu endereço completo e envie um comprovante de matrícula atualizado.'}</p><div class="progressmeta"><strong>${Number(p.progress||0)}% concluído</strong><span>${p.complete?'Tudo certo':'Endereço + matrícula'}</span></div><div class="progressline"><span style="width:${Number(p.progress||0)}%"></span></div><div class="actions"><button class="btn primary" data-nav="perfil">${p.complete?'Revisar meu cadastro':'Completar meu cadastro'} →</button></div></section><aside class="card"><span class="eyebrow">Dados da inscrição</span><h2 style="font-size:20px;margin:13px 0 18px">Seu perfil acadêmico</h2><div class="summaryrow"><span>Nome</span><strong>${esc(p.name||'—')}</strong></div><div class="summaryrow"><span>Instituição</span><strong>${esc(p.institution||'—')}</strong></div><div class="summaryrow"><span>Período</span><strong>${esc(p.period||'—')}</strong></div><div class="summaryrow"><span>Cidade informada na inscrição</span><strong>${esc(p.city||'—')}</strong></div><div class="summaryrow"><span>Comprovante atualizado</span><strong>${p.hasProof?'Sim':'Ainda não'}</strong></div></aside></div><section class="section"><div class="sectionhead"><div><span class="eyebrow">Benefícios</span><h2>O que você encontra no Clube</h2><p>Uma experiência pensada para apoiar sua jornada acadêmica.</p></div></div><div class="grid g3"><div class="card feature"><i>％</i><h3>Descontos exclusivos</h3><p>Vantagens em marcas e lojas parceiras para o dia a dia acadêmico.</p></div><div class="card feature"><i>◎</i><h3>Cursos e capacitações</h3><p>Conteúdos para ir além da grade curricular e acelerar sua formação.</p></div><div class="card feature"><i>★</i><h3>Brindes e sorteios</h3><p>Ações exclusivas e oportunidades para membros do Clube.</p></div></div></section></main></div>`}

function profileView(){const p=state.profile;return `<div>${chrome('perfil')}<main class="page"><span class="eyebrow">Meu perfil</span><h1 class="title">Complete seu cadastro</h1><p class="subtitle">Os dados abaixo vieram da sua inscrição. Para concluir, informe o endereço onde você deseja receber comunicações ou materiais do Clube e envie um comprovante de matrícula atualizado.</p><div class="grid g2" style="margin-top:24px"><form id="profileForm" class="card"><div class="formgrid"><div class="field full"><label>Nome completo</label><input class="input" value="${esc(p.name||'')}" readonly></div><div class="field"><label>E-mail</label><input class="input" value="${esc(p.email||'')}" readonly></div><div class="field"><label>Telefone</label><input class="input" value="${esc(p.phone||'')}" readonly></div><div class="field"><label>Instituição de ensino</label><input class="input" value="${esc(p.institution||'')}" readonly></div><div class="field"><label>Período</label><input class="input" value="${esc(p.period||'')}" readonly></div><div class="field full" style="margin-top:6px"><span class="eyebrow">Endereço completo</span></div><div class="field full"><label>Endereço / Logradouro *</label><input class="input" name="street" value="${esc(p.address||'')}" placeholder="Rua, Avenida, Alameda..." required></div><div class="field"><label>CEP *</label><input class="input" name="cep" inputmode="numeric" value="${esc(p.cep||'')}" placeholder="00000-000" required></div><div class="field"><label>Número *</label><input class="input" name="number" value="${esc(p.number||'')}" placeholder="123" required></div><div class="field"><label>Complemento</label><input class="input" name="complement" value="${esc(p.complement||'')}" placeholder="Apto, bloco, sala..."></div><div class="field"><label>Bairro *</label><input class="input" name="neighborhood" value="${esc(p.neighborhood||'')}" required></div><div class="field full"><label>Cidade *</label><input class="input" name="city" value="${esc(p.addressCity||'')}" required></div><div class="field full"><label>Comprovante de matrícula atualizado ${p.hasProof?'(já enviado)':'*'}</label><div class="filebox"><input id="proofFile" type="file" accept="application/pdf,image/jpeg,image/png" ${p.hasProof?'':'required'}><p>${p.hasProof?'Você já possui um comprovante salvo. Selecione um novo arquivo somente se quiser substituí-lo na base.':'Envie PDF, JPG ou PNG com no máximo 5 MB.'}</p></div></div></div><div class="savebar"><span>${p.hasProof?'<strong>Comprovante já recebido.</strong>':'O comprovante é obrigatório para concluir o cadastro.'}</span><button id="saveBtn" class="btn primary" type="submit">Salvar e concluir</button></div></form><aside class="card"><span class="eyebrow">Progresso</span><div style="font-size:52px;font-weight:900;letter-spacing:-.06em;margin:12px 0 4px;color:var(--red)">${Number(p.progress||0)}%</div><p class="subtitle" style="font-size:12px">${p.complete?'Cadastro completo. Você pode usar esta tela para atualizar endereço ou comprovante quando precisar.':'O cadastro será considerado completo quando endereço, CEP, número, cidade, bairro e comprovante estiverem registrados.'}</p><div class="progressline" style="margin-top:18px"><span style="width:${Number(p.progress||0)}%"></span></div><div class="pills"><span class="pill ${p.address?'good':'warn'}">Endereço</span><span class="pill ${p.cep?'good':'warn'}">CEP</span><span class="pill ${p.number?'good':'warn'}">Número</span><span class="pill ${p.addressCity?'good':'warn'}">Cidade</span><span class="pill ${p.neighborhood?'good':'warn'}">Bairro</span><span class="pill ${p.hasProof?'good':'warn'}">Matrícula</span></div><div class="notice info" style="margin-top:20px">O comprovante é enviado diretamente ao Google Drive do Clube. O arquivo não fica público no portal.</div></aside></div></main></div>`}

function adminLoginView(){return `<main class="login"><section class="loginleft"><div class="loginbox"><a class="brand" href="#/login"><div class="mark">MG</div><div><strong>Clube dos Estudantes</strong><span>Painel Administrativo</span></div></a><div style="margin-top:48px"><span class="eyebrow">Gestão</span><h1>Acesso<br><span>administrativo.</span></h1><p>Use a senha administrativa definida no backend. Ela não é armazenada no navegador.</p></div><form id="adminLoginForm" class="loginform"><div class="field"><label>Senha administrativa</label><input id="adminPassword" class="input" type="password" autocomplete="current-password" required></div><button id="adminLoginBtn" class="btn primary" type="submit">Entrar no painel →</button><button class="btn secondary" type="button" data-student-login>Voltar para acesso do estudante</button></form></div></section><aside class="loginright"><div class="callout"><span class="eyebrow">Complete seu cadastro</span><h2>Acompanhe a evolução da campanha.</h2><p>O painel consolida a base oficial por e-mail e mostra quantos estudantes já concluíram endereço e comprovante.</p></div></aside></main>`}

function adminView(){const d=state.admin||{stats:{total:0,complete:0,pending:0,withProof:0,withoutProof:0},students:[]},s=d.stats;let rows=d.students.filter(x=>{let ok=state.filter==='all'||state.filter==='complete'&&x.complete||state.filter==='pending'&&!x.complete||state.filter==='proof'&&x.hasProof||state.filter==='noProof'&&!x.hasProof;let q=state.search.toLowerCase().trim();return ok&&(!q||[x.name,x.email,x.city,x.institution].join(' ').toLowerCase().includes(q))});return `<div><header class="top"><a class="brand" href="#/admin"><div class="mark">MG</div><div><strong>Clube dos Estudantes</strong><span>Painel Administrativo</span></div></a><div class="user"><button class="linkbtn" data-admin-refresh>Atualizar</button><button class="linkbtn" data-admin-logout>Sair</button></div></header><main class="page"><span class="eyebrow">Gestão</span><h1 class="title">Painel Administrativo</h1><p class="subtitle">Dados consolidados diretamente da planilha oficial. Cadastros repetidos com o mesmo e-mail são considerados pelo registro mais recente.</p><div class="grid g4" style="margin-top:24px"><div class="card stat"><div class="label">Estudantes</div><div class="value">${s.total}</div></div><div class="card stat"><div class="label">Cadastros completos</div><div class="value">${s.complete}</div></div><div class="card stat"><div class="label">Pendentes</div><div class="value">${s.pending}</div></div><div class="card stat"><div class="label">Com comprovante</div><div class="value">${s.withProof}</div></div></div><section class="section"><div class="sectionhead"><div><h2>Base de estudantes</h2><p>Filtro por status do cadastro e comprovante.</p></div></div><div class="toolbar"><input class="input" id="adminSearch" style="max-width:380px" placeholder="Buscar nome, e-mail, cidade ou instituição" value="${esc(state.search)}"><div class="filters">${[['all','Todos'],['pending','Pendentes'],['complete','Completos'],['proof','Com comprovante'],['noProof','Sem comprovante']].map(([k,l])=>`<button class="filter ${state.filter===k?'active':''}" data-filter="${k}">${l}</button>`).join('')}</div></div><div class="tablewrap"><table class="table"><thead><tr><th>Estudante</th><th>Cidade</th><th>Instituição</th><th>Período</th><th>Matrícula</th><th>Status</th><th>Progresso</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><div class="studentcell"><div class="avatar">${initials(x.name)}</div><div><strong>${esc(x.name)}</strong><span>${esc(x.email)}</span></div></div></td><td>${esc(x.city||'—')}</td><td>${esc(x.institution||'—')}</td><td>${esc(x.period||'—')}</td><td>${x.hasProof?'<span class="pill good">Enviado</span>':'<span class="pill warn">Pendente</span>'}</td><td>${x.complete?'<span class="pill good">Completo</span>':'<span class="pill warn">Incompleto</span>'}</td><td><strong>${Number(x.progress||0)}%</strong></td></tr>`).join(''):'<tr><td colspan="7">Nenhum estudante encontrado.</td></tr>'}</tbody></table></div></section></main></div>`}

async function loadProfile(){if(!state.token)return false;try{const d=await api({action:'getProfile',token:state.token});state.profile=d.profile;return true}catch(_){state.token='';state.profile=null;sessionStorage.removeItem('club-token');return false}}
async function loadAdmin(){if(!state.adminToken)return false;try{const d=await api({action:'adminData',token:state.adminToken});state.admin=d;return true}catch(_){state.adminToken='';state.admin=null;sessionStorage.removeItem('club-admin-token');return false}}
function fileToPayload(file){return new Promise((resolve,reject)=>{if(!file)return resolve(null);if(file.size>5*1024*1024)return reject(new Error('O comprovante deve ter no máximo 5 MB.'));const allowed=['application/pdf','image/jpeg','image/png'];if(!allowed.includes(file.type))return reject(new Error('Envie o comprovante em PDF, JPG ou PNG.'));const r=new FileReader();r.onload=()=>resolve({name:file.name,mimeType:file.type,base64:String(r.result).split(',')[1]||''});r.onerror=()=>reject(new Error('Não foi possível ler o arquivo.'));r.readAsDataURL(file)})}

function wire(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav));document.querySelector('[data-logout]')?.addEventListener('click',logout);document.querySelector('[data-admin-open]')?.addEventListener('click',()=>nav('admin-login'));document.querySelector('[data-student-login]')?.addEventListener('click',()=>nav('login'));document.querySelector('[data-back-email]')?.addEventListener('click',()=>nav('login'));
 document.querySelector('#emailForm')?.addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#emailBtn'),email=document.querySelector('#emailInput').value.trim().toLowerCase();state.email=email;sessionStorage.setItem('club-email',email);setLoading(btn,true,'Enviando código');try{const d=await api({action:'requestCode',email});toast('Confira seu e-mail',d.message||'Se o e-mail estiver cadastrado, o código será enviado.');nav('codigo')}catch(err){toast('Não foi possível continuar',err.message)}finally{setLoading(btn,false)}});
 document.querySelector('#codeForm')?.addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#codeBtn'),code=document.querySelector('#codeInput').value.trim();setLoading(btn,true,'Validando');try{const d=await api({action:'verifyCode',email:state.email,code});state.token=d.token;state.profile=d.profile;sessionStorage.setItem('club-token',d.token);toast('Acesso confirmado','Seu cadastro foi localizado.');nav('inicio')}catch(err){toast('Código não aceito',err.message)}finally{setLoading(btn,false)}});
 document.querySelector('[data-resend]')?.addEventListener('click',async e=>{const btn=e.currentTarget;setLoading(btn,true,'Reenviando');try{await api({action:'requestCode',email:state.email});toast('Solicitação enviada','Se o e-mail estiver cadastrado, um novo código chegará em instantes.')}catch(err){toast('Não foi possível reenviar',err.message)}finally{setLoading(btn,false)}});
 document.querySelector('#profileForm')?.addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#saveBtn'),fd=new FormData(e.currentTarget),file=document.querySelector('#proofFile').files?.[0]||null;setLoading(btn,true,'Salvando');try{const filePayload=await fileToPayload(file);const d=await api({action:'completeProfile',token:state.token,address:{street:fd.get('street'),cep:fd.get('cep'),number:fd.get('number'),complement:fd.get('complement'),city:fd.get('city'),neighborhood:fd.get('neighborhood')},file:filePayload});state.profile=d.profile;toast('Cadastro atualizado','Endereço e comprovante foram registrados na base oficial.');render()}catch(err){toast('Não foi possível salvar',err.message)}finally{setLoading(btn,false)}});
 document.querySelector('#adminLoginForm')?.addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#adminLoginBtn'),password=document.querySelector('#adminPassword').value;setLoading(btn,true,'Entrando');try{const d=await api({action:'adminLogin',password});state.adminToken=d.token;sessionStorage.setItem('club-admin-token',d.token);await loadAdmin();nav('admin')}catch(err){toast('Acesso negado',err.message)}finally{setLoading(btn,false)}});
 document.querySelector('[data-admin-logout]')?.addEventListener('click',adminLogout);document.querySelector('[data-admin-refresh]')?.addEventListener('click',async()=>{try{await loadAdmin();toast('Painel atualizado');render()}catch(err){toast('Falha ao atualizar',err.message)}});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render()});document.querySelector('#adminSearch')?.addEventListener('input',e=>{state.search=e.target.value;clearTimeout(window.__adminTimer);window.__adminTimer=setTimeout(render,150)})}

async function render(){state.route=location.hash.replace('#/','')||'login';if(state.route==='login'){app.innerHTML=loginView();wire();return}if(state.route==='codigo'){if(!state.email){nav('login');return}app.innerHTML=codeView();wire();return}if(state.route==='admin-login'){app.innerHTML=adminLoginView();wire();return}if(state.route==='admin'){if(!state.admin&&!(await loadAdmin())){nav('admin-login');return}app.innerHTML=adminView();wire();return}if(!state.profile&&!(await loadProfile())){nav('login');return}if(state.route==='perfil')app.innerHTML=profileView();else app.innerHTML=homeView();wire()}
window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
